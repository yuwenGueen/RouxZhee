main:
  push:
    - imports:
        - https://cnb.cool/yuwen-gueen/secrets/-/blob/main/github.yml
      runner:
        cpus: 4
      docker:
        build: .cnb/Dockerfile
        volumes:
          - /root/.npm:copy-on-write
      stages:
        - name: 安装依赖
          script: npm ci
        - name: 构建 Astro 静态站点
          script: npm run build
        - name: 检查构建产物
          script: |
            test -d dist
            find dist -maxdepth 2 -type f -print | head -100
        - name: 同步到 GitHub
          script: |
            if [ -z "${GITHUB_TOKEN:-}" ]; then
              echo "GITHUB_TOKEN is not set. Check yuwen-gueen/secrets/github.yml"
              exit 1
            fi
            git remote remove github 2>/dev/null || true
            git remote add github "https://x-access-token:${GITHUB_TOKEN}@github.com/yuwenGueen/RouxZhee.git"
            git push github HEAD:main

"**":
  web_trigger:
    - runner:
        cpus: 4
      docker:
        build: .cnb/Dockerfile
        volumes:
          - /root/.npm:copy-on-write
      stages:
        - name: 安装依赖
          script: npm ci
        - name: 构建 Astro 静态站点
          script: npm run build
        - name: 检查构建产物
          script: |
            test -d dist
            find dist -maxdepth 2 -type f -print | head -100

include:
  - .cnb/vscode.yml
